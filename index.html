<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172c2a"><title>ROOM19 — 용산의 작은 생활들</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="desktop.css"></head>
<body><header><a class="brand" href="./"><b>ROOM<span>19</span></b><small>YONGSAN · SEOUL</small></a><div class="title"><strong>용산의 작은 생활들</strong><span>스무 개의 방, 서로 다른 하루.</span></div><div class="clock"><b id="clock"></b><span id="date"></span></div><div class="speed"><button data-speed="0" aria-label="일시 정지">Ⅱ</button><button data-speed="1" class="active">1×</button><button data-speed="4">4×</button><button data-speed="12">12×</button></div></header>
<main><section class="game"><div class="scene-heading"><div><span class="eyebrow">BUILDING 01 / 한강로</span><h1>오늘도, 누군가의 집.</h1></div><span class="weather" id="weather">맑음 · 18°C</span></div><div id="stats" class="stats"></div><div id="scene" class="scene"><div class="view-toggle"><button data-view="cutaway" class="active">◫ 단면 보기</button><button data-view="facade">▥ 외관 보기</button></div><div class="skyline"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="roof"><span>ROOM 19</span><small>YONGSAN RESIDENCE</small><div class="water-tank"></div></div><div id="building" class="building" aria-label="5층 20호실 건물"></div><div class="ground"><span>한강로 19길</span><div class="tree">♧</div><div class="entrance">공동 현관 <b>19</b></div><div class="bike">♧</div></div></div><div class="scene-foot"><span><i class="dot"></i> 생활 중 <i class="dot out"></i> 외출 <i class="dot vacant"></i> 공실 <i class="dot repair"></i> 수리 필요</span><span>호실을 선택하면 안을 살펴볼 수 있어요 ↗</span></div><div class="bottom-controls"><button id="fullscreen" title="전체 화면">⛶</button><button id="next">다음 날 아침까지 →</button><span id="save-status">이 브라우저에 자동 저장</span><button id="export">저장 파일 내보내기</button><label class="file-button">불러오기<input id="import" type="file" accept="application/json"></label><button id="reset">새 게임</button></div></section>
<aside><nav><button class="active" data-tab="applications">입주 심사 <b id="app-count"></b></button><button data-tab="management">건물 관리</button><button data-tab="journal">생활 일지</button></nav><div id="panel"></div><div class="aside-note">살아가는 방식은 저마다 다릅니다.<br>편안한 집이 되도록, 작은 선택을 해주세요.</div></aside></main><div id="toast" role="status"></div><dialog id="room-dialog"><div id="room-detail"></div></dialog><script type="module" src="app.js"></script></body></html>
