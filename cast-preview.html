<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROOM19 · 새로운 이웃 8명</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#1b1e20;color:#eee9df;font-family:system-ui,sans-serif}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}h1{font-size:24px;margin:0;letter-spacing:-1px}header p{font-size:12px;color:#b9b2a5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{position:relative;background:radial-gradient(ellipse at 50% 40%,#62615a,#353a38);border-radius:14px;overflow:hidden;border:1px solid #66675d}img{display:block;width:100%;height:calc((100dvh - 180px)/2);min-height:200px;object-fit:contain}footer{padding:11px 13px;background:#242827;font-size:10px;color:#d1c8b4}a{color:#d3c49f;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}header{display:block}}</style></head><body><header><h1>ROOM19 · 새로운 이웃</h1><p>8개의 얼굴, 8개의 개성 · <a href="./">게임으로</a></p></header><div class="grid" id="cast"></div><script type="module">import {CAST} from './cast.js';document.querySelector('#cast').innerHTML=CAST.map((p,i)=>`<article><img src="assets/cast/${p.file}.png" alt="${p.label}"><footer>${String(i+1).padStart(2,'0')} · ${p.label}</footer></article>`).join('');</script></body></html>
